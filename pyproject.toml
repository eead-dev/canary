[project]
name = "canary"
version = "0.1.0"
description = "Synthetic automotive CAN generation and observation parsing"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.56,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canary*", "simulator*"]
